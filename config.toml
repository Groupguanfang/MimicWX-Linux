# MimicWX-Linux 配置文件

[api]
# API 认证 Token (留空或不配置则不启用认证)
# 请求方式: Header "Authorization: Bearer <token>" 或 Query "?token=<token>"
token = ""

[typing]
enabled = true
max_chars = 40

[listen]
# 启动后自动弹出独立窗口并监听的对象
# 填入联系人名称或群名称 (与微信显示名一致)
# 示例: auto = ["张三", "工作群", "文件传输助手"]
auto = []

[onebot]
# 是否启用 OneBot 11 WebSocket 服务
enabled = true
# 留空时复用 [api].token
token = ""

# 反向 WebSocket，可重复配置多个目标。省略时仅启用正向连接。
# [[onebot.reverse]]
# url = "ws://127.0.0.1:6199/ws"
# token = ""
# numeric_ids = true
